spring:
  application:
    name: dailypull-imagegen

server:
  port: 8090
  # Outil local uniquement : bind loopback pour ne jamais exposer /api/images/**
  # (endpoints sans auth) sur un réseau partagé (ops#657).
  address: 127.0.0.1

imagegen:
  local-enabled: ${IMAGEGEN_LOCAL_ENABLED:true}
  local-script: ${IMAGEGEN_LOCAL_SCRIPT:}
