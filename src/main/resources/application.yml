spring:
  application:
    name: dailypull-imagegen

server:
  port: 8090
  # Outil local uniquement : bind loopback pour ne jamais exposer /api/images/**
  # (endpoints sans auth) sur un réseau partagé (ops#657).
  address: 127.0.0.1

onemin:
  api:
    base-url: https://api.1min.ai
    key: ${ONEMIN_API_KEY}

imagegen:
  output-dir: ${IMAGEGEN_OUTPUT_DIR:./generated-images}
